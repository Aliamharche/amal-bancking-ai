<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Barid Bank - Tableau de Bord</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-building-columns"></i>
                <span>Al Barid Bank</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#"><i class="fa-solid fa-house"></i> Accueil</a></li>
                <li><a href="#"><i class="fa-solid fa-wallet"></i> Mes Comptes</a></li>
                <li><a href="#"><i class="fa-solid fa-money-bill-transfer"></i> Virements</a></li>
                <li><a href="#"><i class="fa-solid fa-credit-card"></i> Cartes Bancaires</a></li>
                <li class="active"><a href="#"><i class="fa-solid fa-robot"></i> Assistant Virtuel</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Paramètres</a></li>
            </ul>
            <div class="user-profile">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="info">
                    <span class="name">Client Premium</span>
                    <span class="id">ID Client: *******</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <h2>Assistant Virtuel AI</h2>
                <div class="header-actions">
                    <button aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
                    <button aria-label="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <!-- Chat Application -->
            <div class="chat-container">
                <div class="chat-wrapper">
                    <div class="chat-header">
                        <div class="logo">
                            <i class="fa-solid fa-dove" style="color: #f1c40f; font-size:1.8rem;"></i>
                            <div class="logo-text">
                                <span class="arabic">البريد بنك</span>
                                <span class="latin">AL BARID BANK</span>
                            </div>
                        </div>
                        <span class="status"><i class="fa-solid fa-circle" style="color:#2ecc71;"></i> En ligne</span>
                    </div>

                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages dynamically added by script.js -->
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Demandez votre solde, un virement, une info..."
                            autocomplete="off">
                        <button id="send-btn" aria-label="Envoyer"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
